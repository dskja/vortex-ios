name: Assemble package-lock
on:
  push:
    paths:
      - '.lock-assemble/**'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          cat .lock-assemble/gz_*.b64 | base64 -d | gzip -d > package-lock.json
          python3 - <<'PY'
          import json
          data = json.load(open("package-lock.json"))
          text = open("package-lock.json").read()
          assert "expo-av" not in text
          assert data["name"] == "vortex-ios"
          print("package-lock.json ok", len(text))
          PY
          rm -rf .lock-assemble
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Assemble package-lock.json without expo-av"
          git push
