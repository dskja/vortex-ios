name: Assemble package-lock
on:
  push:
    paths:
      - '.lock-assemble/**'
      - '.github/workflows/assemble-lock.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dskja-vortex-game-e9ea
          fetch-depth: 0
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          # Restore gzip parts from last commit that still had them
          SRC=6929e5992ab648fa121088fd5f07abfd4e316094
          mkdir -p .lock-assemble
          for i in 00 01 02 03 04 05; do
            git show "$SRC:.lock-assemble/gz_${i}.b64" > ".lock-assemble/gz_${i}.b64"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          root = Path('.lock-assemble')
          # Fix known MCP single-byte corruptions in gz_01
          p = root / 'gz_01.b64'
          b = bytearray(p.read_bytes().strip())
          assert len(b) == 15000, len(b)
          # offset 791: v corrupted to p in some pushes
          if b[791:800] == b'pwH7kCYTk':
              b[791] = ord('v')
              print('fixed offset 791 p->v')
          # offset 13490: Y corrupted to y
          if b[13485:13500] == b'Q7ECFymGoKJtmEA':
              b[13490] = ord('Y')
              print('fixed offset 13490 y->Y')
          assert b[791:800] == b'vwH7kCYTk', b[780:810]
          assert b[13485:13500] == b'Q7ECFYmGoKJtmEA', b[13480:13510]
          expect01 = 'c0ebbddfe8802aabf30f97487b62f30f80ec4113567c451729c47fb50c785ad3'
          got01 = hashlib.sha256(bytes(b)).hexdigest()
          assert got01 == expect01, got01
          p.write_bytes(bytes(b))
          print('gz_01 ok', got01)
          blob = b''.join((root / f'gz_{i:02d}.b64').read_bytes().strip() for i in range(6))
          out = gzip.decompress(base64.b64decode(blob))
          digest = hashlib.sha256(out).hexdigest()
          assert digest == '8899e3618be8e78e2f7183f80f7725649239e04204075971d81c497db289e6f5', digest
          assert b'expo-av' not in out
          assert json.loads(out)['name'] == 'vortex-ios'
          Path('package-lock.json').write_bytes(out)
          print('package-lock.json ok', len(out), digest)
          PY
          rm -rf .lock-assemble
          rm -f debug-pre.txt debug-post.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Assemble package-lock.json without expo-av"
          git push origin HEAD:dskja-vortex-game-e9ea
