name: Assemble package-lock
on:
  push:
    paths:
      - '.lock-assemble/**'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dskja-vortex-game-e9ea
      - name: Assemble package-lock.json
        run: |
          set -x
          python3 -c "
          from pathlib import Path
          p = Path('.lock-assemble/gz_01.b64')
          b = bytearray(p.read_bytes())
          Path('debug-pre.txt').write_text('len=%d at791=%r\n' % (len(b), b[780:810]))
          if len(b)==15000 and b[791:800]==b'pwH7kCYTk':
              b[791]=ord('v')
              p.write_bytes(b)
              Path('debug-pre.txt').write_text(Path('debug-pre.txt').read_text()+'fixed\n')
          "
          set +e
          cat .lock-assemble/gz_*.b64 | base64 -d > /tmp/lock.gz
          echo base64_exit:$?
          gzip -dc /tmp/lock.gz > package-lock.json
          echo gzip_exit:$?
          wc -c package-lock.json /tmp/lock.gz
          python3 -c "
          import hashlib
          from pathlib import Path
          raw = Path('package-lock.json').read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          ok = digest == '8899e3618be8e78e2f7183f80f7725649239e04204075971d81c497db289e6f5' and b'expo-av' not in raw
          Path('debug-post.txt').write_text('len=%d sha=%s ok=%s head=%r\n' % (len(raw), digest, ok, raw[:80]))
          raise SystemExit(0 if ok else 1)
          "
          py=$?
          echo py_exit:$py
          rm -rf .lock-assemble
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if [ "$py" -eq 0 ]; then
            git commit -m "Assemble package-lock.json without expo-av"
          else
            git commit -m "Assemble debug (failed verification)"
          fi
          git push origin HEAD:dskja-vortex-game-e9ea
