name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - dskja-vortex-game-e9ea
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build VORTEX unsigned IPA
    # Expo SDK 57 / ExpoModulesJSI needs Swift 6.2+ → Xcode ≥ 26.4
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      EXPO_USE_PRECOMPILED_MODULES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Expo SDK 57 minimum; avoid 26.5 ExpoModulesJSI regressions
          xcode-version: "26.4.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          ruby -v
          bundle exec pod --version
          ruby -e "require 'json'; puts 'json=' + JSON::VERSION"
          xcodebuild -version
          xcrun swiftc --version | head -n 2
          xcodebuild -showsdks | grep -E 'iOS|iphone' || true

      - name: Install JS dependencies
        run: npm install

      - name: Generate app icons
        run: python3 scripts/gen_assets.py

      - name: Prebuild native iOS project (skip pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable code signing in Podfile
        run: python3 scripts/patch_podfile_unsigned.py

      - name: Install CocoaPods dependencies
        id: pods
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):$PATH"
          set +e
          (cd ios && bundle exec pod install) 2>&1 | tee /tmp/pod-install.log
          POD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$POD_EXIT" -ne 0 ]; then
            exit "$POD_EXIT"
          fi
          test -d "$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"

      - name: Publish pod failure details
        if: failure() && steps.pods.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ pod install failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```text'
            tail -n 250 /tmp/pod-install.log || true
            echo '```'
          } > /tmp/pod-comment.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/pod-comment.md || true

      - name: Detect workspace / scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode-list.json
          SCHEME="$(python3 scripts/pick_xcode_scheme.py)"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          test "$SCHEME" = "VORTEX"

      - name: Build Release iphoneos (unsigned)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build
          # Avoid SPM plugin / macro fingerprint prompts on CI
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES || true
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES || true
          set +e
          xcodebuild build \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          exit "$BUILD_EXIT"

      - name: Upload xcodebuild log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build failure details
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ xcodebuild failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```text'
            (grep -E 'error:|fatal error:|BUILD FAILED|Code Sign|Provisioning|package dependencies|ExpoModulesJSI|ld:|❌|Swift tools version' /tmp/xcodebuild.log || true) | tail -n 200
            echo '--- tail ---'
            tail -n 120 /tmp/xcodebuild.log
            echo '```'
          } > /tmp/build-comment.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/build-comment.md || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry VORTEX-unsigned.ipa Payload)
          ls -lh build/VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-ipa
          path: build/VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
