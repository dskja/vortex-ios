name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - dskja-vortex-game-e9ea
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build VORTEX unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          which node
          ruby -v
          bundle exec pod --version
          xcodebuild -version
          xcode-select -p

      - name: Install JS dependencies
        run: npm install

      - name: Generate app icons
        run: python3 scripts/gen_assets.py

      - name: Prebuild native iOS project (skip pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        id: pods
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):$PATH"
          node --print "require.resolve('expo/package.json')"
          node --print "require.resolve('react-native/package.json')"
          ls -la ios
          set +e
          (cd ios && bundle exec pod install) 2>&1 | tee /tmp/pod-install.log
          POD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "pod_exit=$POD_EXIT"
          if [ "$POD_EXIT" -ne 0 ]; then
            echo "::error::pod install failed — see /tmp/pod-install.log"
            exit "$POD_EXIT"
          fi
          WS="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1 || true)"
          echo "workspace=$WS"
          test -n "$WS" && test -d "$WS"

      - name: Publish pod failure details
        if: failure() && steps.pods.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### ❌ pod install failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```text'
            tail -n 250 /tmp/pod-install.log || echo '(no log)'
            echo '```'
          } | tee /tmp/pod-comment.md
          echo '## Pod install log' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pod-install.log >> "$GITHUB_STEP_SUMMARY" || true
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/pod-comment.md \
            || gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/pod-comment.md \
            || true

      - name: Detect workspace / scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          test -n "$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode-list.json
          SCHEME="$(python3 -c 'import json; data=json.load(open("/tmp/xcode-list.json")); schemes=data.get("workspace",{}).get("schemes") or []; preferred=[s for s in schemes if s.lower()!="pods"]; print((preferred or schemes)[0])')"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild clean archive \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/VORTEX.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/VORTEX.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry VORTEX-unsigned.ipa Payload)
          ls -lh build/VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-ipa
          path: build/VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
