name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - dskja-vortex-game-e9ea
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: false
        default: Release

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build VORTEX unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          which node
          xcodebuild -version
          xcode-select -p
          pod --version || gem list cocoapods || true
          echo "LANG=$LANG LC_ALL=$LC_ALL"

      - name: Install JS dependencies
        run: npm install

      - name: Generate app icons
        run: python3 scripts/gen_assets.py

      - name: Prebuild native iOS project (skip pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        id: pods
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "node=$(which node) $(node -v)"
          echo "pod=$(command -v pod || true)"
          pod --version
          node --print "require.resolve('expo/package.json')"
          node --print "require.resolve('react-native/package.json')"
          ls -la ios
          # Run from repo root — Expo's helper resolves the ios/ Podfile correctly
          npx --yes pod-install
          WS="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1 || true)"
          echo "workspace=$WS"
          test -n "$WS"
          test -d "$WS"
          ls -la ios

      - name: Upload pod failure logs
        if: failure() && steps.pods.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pod-install-debug
          path: |
            ios/Podfile
            ios/Podfile.lock
            ios/Podfile.properties.json
          if-no-files-found: warn
          retention-days: 7

      - name: Detect workspace / scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          if [ -z "$WORKSPACE" ]; then
            echo "No ios/*.xcworkspace after pod install" >&2
            ls -la ios || true
            exit 1
          fi
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode-list.json
          SCHEME="$(python3 -c 'import json; data=json.load(open("/tmp/xcode-list.json")); schemes=data.get("workspace",{}).get("schemes") or []; preferred=[s for s in schemes if s.lower()!="pods"]; print((preferred or schemes)[0])')"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive without signing
        run: |
          set -euo pipefail
          mkdir -p build
          CONFIGURATION="${{ github.event.inputs.configuration || 'Release' }}"

          xcodebuild clean archive \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$PWD/build/VORTEX.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/VORTEX.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive" >&2
            find build -type d -maxdepth 5 || true
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry VORTEX-unsigned.ipa Payload)
          ls -lh build/VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-ipa
          path: build/VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
