name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - dskja-vortex-game-e9ea
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build VORTEX unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      EXPO_USE_PRECOMPILED_MODULES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          ruby -v
          bundle exec pod --version
          ruby -e "require 'json'; puts 'json=' + JSON::VERSION"
          xcodebuild -version

      - name: Install JS dependencies
        run: npm install

      - name: Generate app icons
        run: python3 scripts/gen_assets.py

      - name: Prebuild native iOS project (skip pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable code signing in Podfile
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("ios/Podfile")
          text = path.read_text()
          snippet = """
    installer.pods_project.targets.each do |target|
      target.build_configurations.each do |config|
        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY_NAME'] = ''
      end
    end
"""
          needle = "react_native_post_install("
          if "CODE_SIGNING_ALLOWED'] = 'NO'" in text:
            print("already patched")
          elif needle in text:
            marker = "      :ccache_enabled => ccache_enabled?(podfile_properties),\n    )\n"
            if marker in text:
              text = text.replace(marker, marker + snippet, 1)
              path.write_text(text)
              print("patched Podfile post_install")
            else:
              raise SystemExit("Podfile marker not found for patch")
          else:
              raise SystemExit("Podfile missing react_native_post_install")
          PY

      - name: Install CocoaPods dependencies
        id: pods
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):$PATH"
          set +e
          (cd ios && bundle exec pod install) 2>&1 | tee /tmp/pod-install.log
          POD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$POD_EXIT" -ne 0 ]; then
            exit "$POD_EXIT"
          fi
          test -d "$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"

      - name: Publish pod failure details
        if: failure() && steps.pods.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ pod install failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```text'
            tail -n 250 /tmp/pod-install.log || true
            echo '```'
          } > /tmp/pod-comment.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/pod-comment.md || true

      - name: Detect workspace / scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode-list.json
          SCHEME="$(python3 -c 'import json; data=json.load(open("/tmp/xcode-list.json")); schemes=data.get("workspace",{}).get("schemes") or []; preferred=[s for s in schemes if s.lower()!="pods"]; print((preferred or schemes)[0])')"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using $WORKSPACE / $SCHEME"

      - name: Build Release iphoneos (unsigned)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild build \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_IDENTITY[sdk=iphoneos*]="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          exit "$BUILD_EXIT"

      - name: Publish build failure details
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ xcodebuild failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```text'
            grep -E 'error:|fatal error:|BUILD FAILED|Code Sign|Provisioning|ld:' /tmp/xcodebuild.log | tail -n 120 \
              || tail -n 200 /tmp/xcodebuild.log
            echo '```'
          } > /tmp/build-comment.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/build-comment.md || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry VORTEX-unsigned.ipa Payload)
          ls -lh build/VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-ipa
          path: build/VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
