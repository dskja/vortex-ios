name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - dskja-vortex-game-e9ea
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build VORTEX unsigned IPA
    # Expo SDK 57 / ExpoModulesJSI needs Swift 6.2+ → Xcode ≥ 26.4
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      EXPO_USE_PRECOMPILED_MODULES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Expo SDK 57 minimum; avoid 26.5 ExpoModulesJSI regressions
          xcode-version: "26.4.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          ruby -v
          bundle exec pod --version
          ruby -e "require 'json'; puts 'json=' + JSON::VERSION"
          xcodebuild -version
          xcrun swiftc --version | head -n 2
          xcodebuild -showsdks | grep -E 'iOS|iphone' || true

      - name: Install JS dependencies
        run: npm install

      - name: Generate app icons
        run: python3 scripts/gen_assets.py

      - name: Prebuild native iOS project (skip pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable code signing (Podfile + app project)
        run: |
          python3 scripts/patch_podfile_unsigned.py
          python3 scripts/patch_app_unsigned.py

      - name: Install CocoaPods dependencies
        id: pods
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):$PATH"
          set +e
          (cd ios && bundle exec pod install) 2>&1 | tee /tmp/pod-install.log
          POD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$POD_EXIT" -ne 0 ]; then
            exit "$POD_EXIT"
          fi
          test -d "$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"

      - name: Publish pod failure details
        if: failure() && steps.pods.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ pod install failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```text'
            tail -n 80 /tmp/pod-install.log || true
            echo '```'
          } > /tmp/pod-comment.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/pod-comment.md || true

      - name: Prebuild ExpoModulesJSI (iphoneos)
        id: jsi
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which node)"):$PATH"
          JSI_SCRIPT="$(find node_modules -path '*/expo-modules-jsi/apple/scripts/build-xcframework.sh' | head -n 1)"
          test -n "$JSI_SCRIPT"
          echo "JSI_SCRIPT=$JSI_SCRIPT"
          set +e
          (
            cd "$(dirname "$JSI_SCRIPT")/.."
            export PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods"
            export PLATFORM_NAME=iphoneos
            export DEVELOPER_DIR="$(xcode-select -p)"
            bash "./scripts/build-xcframework.sh"
          ) 2>&1 | tee /tmp/expo-modules-jsi.log
          JSI_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$JSI_EXIT" -ne 0 ]; then
            echo "::error::ExpoModulesJSI prebuild failed (exit $JSI_EXIT)"
            # Emit first errors as annotations (readable via Checks API)
            grep -E 'error:|fatal error|BUILD FAILED|Swift tools|did not produce|❌' /tmp/expo-modules-jsi.log \
              | head -n 40 \
              | while IFS= read -r line; do echo "::error::$line"; done || true
            exit "$JSI_EXIT"
          fi

      - name: Detect workspace / scheme
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode-list.json
          SCHEME="$(python3 scripts/pick_xcode_scheme.py)"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          test "$SCHEME" = "VORTEX"

      - name: Build Release iphoneos (ad-hoc / unsigned)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES || true
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES || true
          set +e
          # Prefer ad-hoc (-) over CODE_SIGNING_ALLOWED=NO — the latter breaks
          # XCFramework copy / embed phases mid-build on modern Xcode.
          xcodebuild build \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::xcodebuild failed (exit $BUILD_EXIT)"
            # Tight pattern — avoid matching long compiler command lines
            grep -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|Command PhaseScriptExecution failed|Code Sign Error|requires a provisioning|Swift tools version' /tmp/xcodebuild.log \
              | head -n 40 \
              | while IFS= read -r line; do echo "::error::$line"; done || true
            echo '--- log tail ---' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 /tmp/xcodebuild.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$BUILD_EXIT"

      - name: Upload failure logs
        if: failure() && (steps.build.outcome == 'failure' || steps.jsi.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-logs
          path: |
            /tmp/xcodebuild.log
            /tmp/expo-modules-jsi.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build failure details
        if: failure() && (steps.build.outcome == 'failure' || steps.jsi.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ iOS build failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```text'
            echo '--- log tail (most relevant) ---'
            if [ -f /tmp/xcodebuild.log ]; then
              tail -n 80 /tmp/xcodebuild.log
            fi
            echo
            echo '--- filtered errors ---'
            if [ -f /tmp/expo-modules-jsi.log ]; then
              (grep -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|did not produce|Swift tools' /tmp/expo-modules-jsi.log || true) | tail -n 30
            fi
            if [ -f /tmp/xcodebuild.log ]; then
              (grep -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|Command PhaseScriptExecution failed|Code Sign Error|requires a provisioning|Swift tools version' /tmp/xcodebuild.log || true) | tail -n 40
            fi
            echo '```'
          } > /tmp/build-comment.md
          head -c 60000 /tmp/build-comment.md > /tmp/build-comment-trim.md
          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/build-comment-trim.md || true
          cat /tmp/build-comment-trim.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry VORTEX-unsigned.ipa Payload)
          ls -lh build/VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-ipa
          path: build/VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
